eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
app.security.jwt.public-key=${JWT_PUBLIC_KEY}
app.security.jwt.issuer=banking-identity
app.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8000}
app.internal.token=${SERVICE_TOKEN}
app.internal.token-hashes.identity-service=${IDENTITY_SERVICE_TOKEN_HASH}
app.internal.token-hashes.accounts-ledger-service=${ACCOUNTS_SERVICE_TOKEN_HASH}
app.internal.token-hashes.payments-service=${PAYMENTS_SERVICE_TOKEN_HASH}
app.internal.token-hashes.products-service=${PRODUCTS_SERVICE_TOKEN_HASH}
app.internal.token-hashes.notification-service=${NOTIFICATION_SERVICE_TOKEN_HASH}
app.internal.token-hashes.audit-reporting-service=${AUDIT_SERVICE_TOKEN_HASH}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
eureka.client.healthcheck.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.events.transport=${EVENT_TRANSPORT:http}
app.events.kafka.topic=${KAFKA_EVENT_TOPIC:banking.events.v1}
app.events.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
app.events.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
app.events.kafka.send-timeout=${KAFKA_SEND_TIMEOUT:10s}
app.events.kafka.retry-interval-ms=${KAFKA_RETRY_INTERVAL_MS:1000}
app.events.kafka.retry-attempts=${KAFKA_RETRY_ATTEMPTS:3}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=true
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.netbanking.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.netbanking.events.EventEnvelope
spring.kafka.listener.ack-mode=record
