spring.application.name=net-banking-backend
server.error.include-message=never

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.health-check-url-path=/actuator/health

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Internet Banking backend API

app.security.max-failed-login-attempts=5
app.security.account-lock-minutes=15
app.security.jwt.expiration-minutes=30
app.security.totp.login-challenge-minutes=5
app.security.cors.allowed-origins=http://localhost:8000,http://localhost:8080,http://localhost:4200
