<div class="oj-hybrid-padding">
  <h1>Transaction History</h1>
  <p class="oj-typography-body-md">Filter activity and prepare a statement export.</p>

  <form class="oj-flex oj-sm-flex-wrap-wrap oj-sm-margin-4x-top" data-bind="submit: applyFilters">
    <label class="oj-flex-item oj-sm-12 oj-md-3 oj-sm-padding-2x">
      Account
      <select class="oj-form-control" data-bind="value: selectedAccountId">
        <!-- ko foreach: accountOptions -->
        <option data-bind="value: id, text: label"></option>
        <!-- /ko -->
      </select>
    </label>
    <label class="oj-flex-item oj-sm-12 oj-md-3 oj-sm-padding-2x">
      Search narration or reference
      <input class="oj-form-control" type="search" data-bind="value: searchText" />
    </label>
    <label class="oj-flex-item oj-sm-12 oj-md-2 oj-sm-padding-2x">
      From
      <input class="oj-form-control" type="date" data-bind="value: fromDate" />
    </label>
    <label class="oj-flex-item oj-sm-12 oj-md-2 oj-sm-padding-2x">
      To
      <input class="oj-form-control" type="date" data-bind="value: toDate" />
    </label>
    <div class="oj-flex-item oj-sm-12 oj-md-2 oj-sm-padding-2x member2-form-actions">
      <oj-button type="submit">Apply filters</oj-button>
      <oj-button on-oj-action="[[exportStatement]]">Export CSV</oj-button>
    </div>
  </form>

  <p class="oj-typography-body-sm" aria-live="polite" data-bind="text: message"></p>

  <div class="oj-sm-margin-4x-top" data-bind="if: filteredTransactions().length">
    <table class="oj-table member2-table">
      <thead>
        <tr><th>Date</th><th>Reference</th><th>Narration</th><th>Type</th><th class="member2-align-right">Amount</th><th>Status</th></tr>
      </thead>
      <tbody data-bind="foreach: filteredTransactions">
        <tr>
          <td data-bind="text: postedAt"></td>
          <td data-bind="text: reference"></td>
          <td data-bind="text: narration"></td>
          <td data-bind="text: type"></td>
          <td class="member2-align-right" data-bind="text: amount"></td>
          <td data-bind="text: status"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="oj-typography-body-md" data-bind="ifnot: filteredTransactions().length">No transactions match these filters.</p>
</div>
