<div class="nb-page">
  <header class="nb-page-head">
    <p class="nb-kicker">Account activity</p>
    <h1>Transactions</h1>
    <p class="nb-lede">Review posted entries, filter by date, and download a full account statement.</p>
  </header>

  <form class="member2-form nb-sheet" data-bind="submit: applyFilters">
    <div class="member2-toolbar">
      <label for="transactionsAccount">Account
        <select id="transactionsAccount" data-bind="options: accounts, optionsText: accountLabel, optionsValue: 'accountId', value: selectedAccountId"></select>
      </label>
      <label for="transactionsSearch">Search visible entries
        <input id="transactionsSearch" type="search" data-bind="value: searchText, valueUpdate: 'input'">
      </label>
      <label for="transactionsFrom">From
        <input id="transactionsFrom" type="date" data-bind="value: fromDate">
      </label>
      <label for="transactionsTo">To
        <input id="transactionsTo" type="date" data-bind="value: toDate">
      </label>
    </div>
    <div class="member2-actions">
      <oj-c-button button-type="submit" chroming="callToAction" label="Apply filters" disabled="[[loading]]"></oj-c-button>
      <oj-c-button chroming="outlined" label="Export CSV" disabled="[[exporting]]" on-oj-action="[[exportStatement]]"></oj-c-button>
    </div>
  </form>

  <p class="nb-status" role="status" data-bind="visible: loading">Loading transactions…</p>
  <div class="nb-alert" role="alert" data-bind="visible: error">
    <span class="nb-alert-text" data-bind="text: error"></span>
  </div>
  <p class="nb-hint" role="status" data-bind="visible: message, text: message"></p>
  <div class="nb-empty-panel" data-bind="visible: !loading() && !error() && filteredTransactions().length === 0">
    <strong>No matching transactions</strong>
    <span>Try another date range or search term.</span>
  </div>

  <div class="member2-table-wrap" data-bind="visible: !loading() && !error() && filteredTransactions().length > 0">
    <table class="member2-table">
      <thead><tr><th>Date</th><th>Reference</th><th>Narration</th><th>Type</th><th class="member2-align-right">Amount</th><th>Status</th></tr></thead>
      <tbody data-bind="foreach: filteredTransactions">
        <tr>
          <td data-bind="text: $parent.dateTime(postedAt)"></td>
          <td class="nb-mono" data-bind="text: reference"></td>
          <td data-bind="text: narration || '—'"></td>
          <td data-bind="text: type"></td>
          <td class="member2-align-right" data-bind="text: $parent.money(amount, currencyCode)"></td>
          <td data-bind="text: status"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
