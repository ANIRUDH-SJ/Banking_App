<div class="nb-page nb-statement">
  <header class="nb-page-head has-actions">
    <p class="nb-kicker">Accounts</p>
    <h1>Transactions</h1>
    <p class="nb-lede">Search an account's history by date, type and status, and download the same view as a CSV statement.</p>
    <div class="nb-head-actions">
      <oj-c-button chroming="outlined" label="[[downloading() ? 'Preparing…' : 'Download CSV']]" disabled="[[downloading() || !accountId()]]" on-oj-action="[[download]]">
        <span slot="startIcon" class="nb-icon i-download" aria-hidden="true"></span>
      </oj-c-button>
    </div>
  </header>

  <div class="nb-alert" role="alert" data-bind="visible: problem.text">
    <span class="nb-alert-text" data-bind="text: problem.text"></span>
    <span class="nb-alert-ref" data-bind="visible: problem.reference, text: problem.reference"></span>
  </div>

  <section class="nb-sheet" aria-label="Filters">
    <div class="nb-toolbar">
      <oj-c-select-single label-hint="Account" data="[[accountOptions]]" item-text="label" value="{{accountId}}"></oj-c-select-single>
      <oj-c-input-date-text label-hint="From" value="{{from}}" messages-custom="[[dateMessages]]"></oj-c-input-date-text>
      <oj-c-input-date-text label-hint="To" value="{{to}}"></oj-c-input-date-text>
      <oj-c-select-single label-hint="Type" data="[[typeOptions]]" item-text="label" value="{{type}}"></oj-c-select-single>
      <oj-c-select-single label-hint="Status" data="[[statusOptions]]" item-text="label" value="{{status}}"></oj-c-select-single>
      <div class="nb-actions">
        <oj-c-button chroming="callToAction" label="Apply" on-oj-action="[[apply]]"></oj-c-button>
        <oj-c-button chroming="borderless" label="Reset" on-oj-action="[[reset]]"></oj-c-button>
      </div>
    </div>
  </section>

  <section class="nb-sheet" aria-labelledby="statement-heading">
    <div class="nb-sheet-head">
      <div>
        <h2 id="statement-heading" data-bind="text: account() ? label(account().accountType) + ' ' + account().accountNumber : 'Statement'"></h2>
        <p class="nb-sheet-sub" data-bind="text: rangeText"></p>
      </div>
      <span class="nb-chip" data-bind="visible: account, text: account() ? 'Available ' + money(account().availableBalance, account().currencyCode) : ''"></span>
    </div>

    <div class="nb-rail-skeleton" data-bind="visible: loading" aria-hidden="true">
      <!-- ko foreach: [1, 2, 3, 4, 5] -->
      <oj-c-skeleton height="2.5rem"></oj-c-skeleton>
      <!-- /ko -->
    </div>
    <p class="nb-sr" role="status" data-bind="text: loading() ? 'Loading transactions' : rangeText()"></p>

    <div class="nb-empty-panel is-quiet" data-bind="visible: !loading() && rows().length === 0">
      <span class="nb-empty-glyph i-transactions" aria-hidden="true"></span>
      <p><strong>No transactions found</strong></p>
      <p>Try a wider date range or clear the filters.</p>
    </div>

    <div class="nb-table-wrap" data-bind="visible: !loading() && rows().length">
      <table class="nb-table">
        <caption class="nb-sr">Transactions for the selected account</caption>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Details</th>
            <th scope="col" class="is-wide">Type</th>
            <th scope="col">Status</th>
            <th scope="col" class="is-num">Amount</th>
            <th scope="col" class="is-num is-wide">Balance</th>
          </tr>
        </thead>
        <tbody data-bind="foreach: rows">
          <tr>
            <td class="is-date">
              <span data-bind="text: $parent.date(postedAt)"></span>
              <span class="nb-table-sub" data-bind="text: $parent.time(postedAt)"></span>
            </td>
            <td class="is-details">
              <span data-bind="text: $data.narration || $parent.label($data.type) || 'Transaction'"></span>
              <span class="nb-table-sub nb-mono" data-bind="text: reference"></span>
            </td>
            <td class="is-wide" data-bind="text: $parent.label($data.type)"></td>
            <td class="is-status"><oj-c-badge size="sm" variant="[[$parent.statusVariant(status)]]" label="[[$parent.label(status)]]"></oj-c-badge></td>
            <td class="is-num is-amount" data-bind="text: $parent.signed($data), css: { 'is-credit': entryType === 'CREDIT' }"></td>
            <td class="is-num is-wide" data-bind="text: $data.balanceAfter != null ? $parent.money(balanceAfter, currencyCode) : '—'"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="nb-pager" data-bind="visible: totalPages() > 1">
      <oj-c-button chroming="outlined" label="Previous" disabled="[[page() === 0 || loading()]]" on-oj-action="[[previous]]"></oj-c-button>
      <span class="nb-pager-at" data-bind="text: 'Page ' + (page() + 1) + ' of ' + totalPages()"></span>
      <oj-c-button chroming="outlined" label="Next" disabled="[[page() + 1 >= totalPages() || loading()]]" on-oj-action="[[next]]"></oj-c-button>
    </div>
  </section>
</div>
