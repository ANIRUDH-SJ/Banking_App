<div class="oj-hybrid-padding">
  <h1>Beneficiaries</h1>
  <p class="oj-typography-body-md">Add, verify, and manage people or accounts you transfer money to.</p>

  <form class="member2-form oj-sm-margin-4x-top" data-bind="submit: addBeneficiary">
    <h2 class="oj-typography-heading-sm">Add beneficiary</h2>
    <label>Nickname<input class="oj-form-control" maxlength="100" data-bind="value: form.nickname" /></label>
    <label>Beneficiary name<input class="oj-form-control" maxlength="200" data-bind="value: form.beneficiaryName" /></label>
    <label>Account number<input class="oj-form-control" inputmode="numeric" maxlength="20" data-bind="value: form.accountNumber" /></label>
    <label>IFSC code<input class="oj-form-control" maxlength="11" data-bind="value: form.ifscCode" /></label>
    <label>Bank name<input class="oj-form-control" maxlength="200" data-bind="value: form.bankName" /></label>
    <oj-button type="submit">Add beneficiary</oj-button>
  </form>

  <p class="oj-typography-body-sm" aria-live="polite" data-bind="text: message"></p>
  <p class="oj-typography-body-md" data-bind="visible: beneficiaries().length === 0">
    No beneficiaries have been added yet.
  </p>
  <div class="oj-flex oj-sm-flex-wrap-wrap oj-sm-margin-4x-top" data-bind="foreach: beneficiaries">
    <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-4 oj-sm-padding-2x">
      <section class="member2-card">
        <h2 class="oj-typography-heading-sm" data-bind="text: nickname"></h2>
        <p data-bind="text: beneficiaryName"></p>
        <p class="oj-typography-body-sm"><span data-bind="text: maskedAccountNumber"></span> · <span data-bind="text: ifscCode"></span></p>
        <p class="oj-typography-body-sm"><span data-bind="text: bankName"></span> · <strong data-bind="text: status"></strong></p>
        <button type="button" class="member2-inline-action" data-bind="click: function () { $parent.requestActivation($data); }, visible: status === 'PENDING'">Verify</button>
        <button type="button" class="member2-inline-action" data-bind="click: function () { $parent.disableBeneficiary($data); }">Remove</button>
      </section>
    </div>
  </div>
</div>
