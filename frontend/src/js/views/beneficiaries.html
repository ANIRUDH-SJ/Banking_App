<div class="nb-page">
  <header class="nb-page-head">
    <p class="nb-kicker">Transfers</p>
    <h1>Beneficiaries</h1>
    <p class="nb-lede">Add a recipient, then verify the one-time code before making a transfer.</p>
  </header>

  <div class="nb-alert" role="alert" data-bind="visible: error">
    <span class="nb-alert-text" data-bind="text: error"></span>
  </div>
  <p class="nb-success" role="status" data-bind="visible: message, text: message"></p>

  <form class="member2-form nb-sheet" data-bind="submit: addBeneficiary">
    <h2 class="nb-form-section">Add beneficiary</h2>
    <label for="beneficiaryNickname">Nickname
      <input id="beneficiaryNickname" maxlength="100" required data-bind="value: form.nickname">
    </label>
    <label for="beneficiaryName">Beneficiary name
      <input id="beneficiaryName" maxlength="200" required data-bind="value: form.beneficiaryName">
    </label>
    <label for="beneficiaryAccount">Account number
      <input id="beneficiaryAccount" inputmode="numeric" maxlength="20" required data-bind="value: form.accountNumber">
    </label>
    <label for="beneficiaryIfsc">IFSC code
      <input id="beneficiaryIfsc" maxlength="11" required data-bind="value: form.ifscCode">
    </label>
    <label for="beneficiaryBank">Bank name
      <input id="beneficiaryBank" maxlength="200" required data-bind="value: form.bankName">
    </label>
    <div class="nb-actions">
      <oj-c-button button-type="submit" chroming="callToAction" label="Add beneficiary" disabled="[[busy]]"></oj-c-button>
    </div>
  </form>

  <form class="member2-form nb-sheet" data-bind="visible: activationTarget, submit: activate">
    <h2 class="nb-form-section">Verify beneficiary</h2>
    <p>Enter the six-digit code sent for <strong data-bind="text: activationTarget() && activationTarget().nickname"></strong>.</p>
    <label for="beneficiaryCode">One-time code
      <input id="beneficiaryCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required data-bind="value: activationCode">
    </label>
    <div class="member2-actions">
      <oj-c-button button-type="submit" chroming="callToAction" label="Verify beneficiary" disabled="[[busy]]"></oj-c-button>
      <oj-c-button chroming="outlined" label="Cancel" on-oj-action="[[cancelActivation]]"></oj-c-button>
    </div>
  </form>

  <div class="nb-actions">
    <oj-c-button chroming="outlined" label="Refresh list" disabled="[[loading]]" on-oj-action="[[refresh]]"></oj-c-button>
  </div>
  <p class="nb-status" role="status" data-bind="visible: loading">Loading beneficiaries…</p>
  <div class="nb-empty-panel" data-bind="visible: !loading() && !error() && beneficiaries().length === 0">
    <strong>No beneficiaries yet</strong>
    <span>Recipients you add will appear here.</span>
  </div>
  <div class="member2-grid" data-bind="foreach: beneficiaries">
    <article class="member2-card">
      <h2 data-bind="text: nickname"></h2>
      <p data-bind="text: beneficiaryName"></p>
      <p class="member2-meta nb-mono" data-bind="text: maskedAccountNumber"></p>
      <p class="member2-meta" data-bind="text: bankName + ' · ' + ifscCode"></p>
      <p class="member2-meta">Status <strong data-bind="text: status"></strong></p>
      <div class="member2-actions">
        <button type="button" class="member2-inline-action" data-bind="click: function () { $parent.requestActivation($data); }, visible: status === 'PENDING', disable: $parent.busy">Verify</button>
        <button type="button" class="member2-inline-action" data-bind="click: function () { $parent.disableBeneficiary($data); }, visible: status !== 'DISABLED', disable: $parent.busy">Disable</button>
      </div>
    </article>
  </div>
</div>
