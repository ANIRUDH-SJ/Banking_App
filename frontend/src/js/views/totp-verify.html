<div class="nb-page nb-access">
  <header class="nb-page-head">
    <p class="nb-kicker">Step 2 of 2</p>
    <h1 id="verify-heading">Enter your authenticator code</h1>
    <p class="nb-lede">Open Microsoft Authenticator and enter the six-digit code shown for ORACLE INTERNATIONAL BANK (OIB). This step expires after a few minutes.</p>
  </header>
  <div class="nb-alert" role="alert" data-bind="visible: formError">
    <span class="nb-alert-text" data-bind="text: formError"></span>
    <span class="nb-alert-ref" data-bind="visible: reference, text: reference"></span>
  </div>
  <form class="nb-form" novalidate data-bind="submit: verify" aria-labelledby="verify-heading">
    <oj-c-form-layout direction="column" label-edge="top" user-assistance-density="reflow">
      <oj-c-input-text
        class="nb-code-input"
        label-hint="Six-digit code"
        value="{{code}}"
        messages-custom="[[codeMessages]]"
        autocomplete="one-time-code"
        virtual-keyboard="number"></oj-c-input-text>
    </oj-c-form-layout>
    <div class="nb-actions">
      <oj-c-button button-type="submit" chroming="callToAction" width="100%" label="[[busy() ? 'Checking…' : 'Sign in']]" disabled="[[busy]]"></oj-c-button>
    </div>
  </form>
  <p class="nb-inline-link"><a href="#" data-bind="click: restart">Start sign-in again</a></p>
</div>
