<div class="nb-page">
  <header class="nb-page-head">
    <p class="nb-kicker">Messages from the bank</p>
    <h1>Notices</h1>
  </header>
  <section class="nb-panel" aria-labelledby="notices-heading">
    <h2 id="notices-heading" class="nb-sr">Notice list</h2>
    <p class="nb-status" role="status" data-bind="visible: loading">Loading notices…</p>
    <div class="nb-alert" role="alert" data-bind="visible: error, text: error"></div>
    <p class="nb-reference" data-bind="visible: reference, text: reference"></p>
    <p class="nb-empty" data-bind="visible: !loading() && !error() && notices().length === 0">You have no notices.</p>
    <ul class="nb-notices" data-bind="foreach: notices">
      <li class="nb-notice" data-bind="css: { 'is-unread': !read }">
        <h3 data-bind="text: title"></h3>
        <p data-bind="text: message"></p>
        <p class="nb-meta"><time data-bind="text: $parent.when(createdAt)"></time></p>
        <button type="button" class="nb-text-button" data-bind="visible: !read, click: function () { $parent.markRead($data); }, enable: $parent.busyId() !== notificationId">Mark as read</button>
      </li>
    </ul>
    <div class="nb-actions" data-bind="visible: page() > 0 || !last()">
      <oj-button chroming="outlined" on-oj-action="[[newer]]" disabled="[[page() === 0]]">Newer</oj-button>
      <oj-button chroming="outlined" on-oj-action="[[older]]" disabled="[[last]]">Older</oj-button>
    </div>
  </section>
</div>
