<div class="nb-page nb-notices-page">
  <header class="nb-page-head">
    <p class="nb-kicker">Messages from the bank</p>
    <h1 id="notices-heading">Notices</h1>
    <p class="nb-lede">Security alerts, payment results and service messages. The bank will never ask for your password or authenticator code here.</p>
  </header>

  <div class="nb-alert" role="alert" data-bind="visible: error">
    <span class="nb-alert-text" data-bind="text: error"></span>
    <span class="nb-alert-ref" data-bind="visible: reference, text: reference"></span>
  </div>

  <section class="nb-sheet" aria-labelledby="notices-heading">
    <ul class="nb-notices" data-bind="visible: loading" aria-hidden="true">
      <!-- ko foreach: [1, 2, 3] -->
      <li class="nb-notice is-skeleton">
        <oj-c-skeleton height="0.75rem" width="7rem"></oj-c-skeleton>
        <div>
          <oj-c-skeleton height="1rem" width="45%"></oj-c-skeleton>
          <oj-c-skeleton height="0.875rem" width="85%"></oj-c-skeleton>
        </div>
      </li>
      <!-- /ko -->
    </ul>
    <p class="nb-sr" role="status" data-bind="text: loading() ? 'Loading notices' : ''"></p>

    <div class="nb-empty-panel is-quiet" data-bind="visible: !loading() && !error() && notices().length === 0">
      <span class="nb-empty-glyph i-bell" aria-hidden="true"></span>
      <p><strong>You are all caught up</strong></p>
      <p>New messages from the bank will appear here.</p>
    </div>

    <ul class="nb-notices" data-bind="visible: !loading(), foreach: notices">
      <li class="nb-notice" data-bind="css: { 'is-unread': !$data.read }">
        <span class="nb-notice-dot" aria-hidden="true"></span>
        <div class="nb-notice-body">
          <h2 class="nb-notice-title">
            <span data-bind="text: title"></span>
            <span class="nb-sr" data-bind="text: $data.read ? '' : ', unread'"></span>
          </h2>
          <p data-bind="text: message"></p>
          <p class="nb-notice-when"><time data-bind="text: $parent.when(createdAt)"></time></p>
        </div>
        <oj-c-button
          data-bind="visible: !$data.read"
          chroming="borderless"
          size="sm"
          label="Mark as read"
          disabled="[[$parent.busyId() === notificationId]]"
          on-oj-action="[[$parent.markReadAction]]"></oj-c-button>
      </li>
    </ul>
  </section>

  <div class="nb-pager" data-bind="visible: page() > 0 || !last()">
    <oj-c-button chroming="outlined" label="Newer" on-oj-action="[[newer]]" disabled="[[page() === 0]]"></oj-c-button>
    <span class="nb-pager-at" data-bind="text: 'Page ' + (page() + 1)"></span>
    <oj-c-button chroming="outlined" label="Older" on-oj-action="[[older]]" disabled="[[last]]"></oj-c-button>
  </div>
</div>
