<div class="nb-page">
  <header class="nb-page-head">
    <p class="nb-kicker">Your money</p>
    <h1>Accounts</h1>
    <p class="nb-lede">Balances and status come directly from the bank's account records.</p>
  </header>

  <div class="nb-actions">
    <oj-c-button chroming="outlined" label="Refresh balances" disabled="[[loading]]" on-oj-action="[[refreshAccounts]]"></oj-c-button>
    <span class="nb-hint" data-bind="visible: lastUpdated">Updated <span data-bind="text: lastUpdated"></span></span>
  </div>

  <p class="nb-status" role="status" data-bind="visible: loading">Loading accounts…</p>
  <div class="nb-alert" role="alert" data-bind="visible: error">
    <span class="nb-alert-text" data-bind="text: error"></span>
  </div>
  <div class="nb-empty-panel" data-bind="visible: !loading() && !error() && accounts().length === 0">
    <strong>No accounts available</strong>
    <span>Accounts linked to your customer profile will appear here.</span>
  </div>

  <div class="member2-grid" data-bind="visible: !loading() && !error(), foreach: accounts">
    <article class="member2-card">
      <h2 data-bind="text: $parent.label(accountType) + ' account'"></h2>
      <p class="nb-mono member2-meta" data-bind="text: $parent.mask(accountNumber)"></p>
      <p class="member2-balance" data-bind="text: $parent.money(currentBalance, currencyCode)"></p>
      <p class="member2-meta">Available <strong data-bind="text: $parent.money(availableBalance, currencyCode)"></strong></p>
      <p class="member2-meta">Status <strong data-bind="text: $parent.label(accountStatus)"></strong></p>
    </article>
  </div>
</div>
