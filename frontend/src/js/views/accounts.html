<div class="oj-hybrid-padding">
  <div class="oj-flex oj-sm-align-items-center oj-sm-justify-content-space-between">
    <div>
      <h1>My Accounts</h1>
      <p class="oj-typography-body-md">
        Review account balances and account status in one place.
      </p>
    </div>

    <oj-button id="refreshAccountsButton" on-oj-action="[[refreshAccounts]]">
      Refresh
    </oj-button>
  </div>

  <p class="oj-typography-body-sm" aria-live="polite">
    <span data-bind="text: accountStatus"></span>
    <span> Last updated: </span>
    <span data-bind="text: lastUpdated"></span>
  </p>

  <p class="oj-typography-body-md" data-bind="visible: accounts().length === 0">
    No accounts are available for this customer.
  </p>

  <div class="oj-flex oj-sm-flex-wrap-wrap oj-sm-margin-6x-top" data-bind="foreach: accounts">
    <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-4 oj-sm-padding-2x">
      <oj-panel>
        <h2 class="oj-typography-heading-sm" data-bind="text: accountName"></h2>
        <p class="oj-typography-body-sm" data-bind="text: accountNumber"></p>

        <p class="oj-typography-body-lg" data-bind="text: balance"></p>
        <p class="oj-typography-body-sm">
          Available balance · <span data-bind="text: status"></span>
        </p>
      </oj-panel>
    </div>
  </div>
</div>
