<div class="nb-page nb-billers">
  <header class="nb-page-head">
    <p class="nb-kicker">Payments</p>
    <h1>Billers</h1>
    <p class="nb-lede">Utilities and service providers you can pay online. Choose one to start a payment.</p>
  </header>

  <div class="nb-alert" role="alert" data-bind="visible: problem.text">
    <span class="nb-alert-text" data-bind="text: problem.text"></span>
    <span class="nb-alert-ref" data-bind="visible: problem.reference, text: problem.reference"></span>
  </div>

  <section class="nb-sheet nb-form" aria-labelledby="biller-catalogue-heading">
    <div class="nb-panel-head">
      <h2 id="biller-catalogue-heading" class="nb-panel-title">Biller catalogue</h2>
      <oj-c-input-text class="nb-search" label-hint="Search billers" label-edge="none" placeholder="Search billers" value="{{search}}" raw-value="{{searchRaw}}" clear-icon="conditional"></oj-c-input-text>
    </div>

    <div class="nb-choices" data-bind="visible: loading" aria-hidden="true">
      <!-- ko foreach: [1, 2, 3] -->
      <div class="nb-choice is-skeleton"><oj-c-skeleton height="2.5rem" width="2.5rem" border-radius="50%"></oj-c-skeleton><oj-c-skeleton height="0.875rem" width="70%"></oj-c-skeleton></div>
      <!-- /ko -->
    </div>

    <div class="nb-empty-panel is-quiet" data-bind="visible: !loading() && groups().length === 0">
      <span class="nb-empty-glyph i-billers" aria-hidden="true"></span>
      <p><strong data-bind="text: searchRaw() ? 'No billers match' : 'No billers available'"></strong></p>
      <p data-bind="text: searchRaw() ? 'Try a different name or category.' : 'The biller catalogue is empty.'"></p>
    </div>

    <!-- ko foreach: groups -->
    <h3 class="nb-day" data-bind="text: category"></h3>
    <ul class="nb-choices" data-bind="foreach: billers">
      <li>
        <button type="button" class="nb-choice" data-bind="click: $parents[1].pay, attr: { 'aria-label': 'Pay ' + name }">
          <span class="nb-glyph" data-bind="css: $parents[1].glyph($data)" aria-hidden="true"></span>
          <span class="nb-choice-main">
            <span class="nb-choice-name" data-bind="text: name"></span>
            <span class="nb-choice-meta" data-bind="text: $parents[1].limits($data)"></span>
          </span>
          <span class="nb-choice-cta">Pay</span>
        </button>
      </li>
    </ul>
    <!-- /ko -->
  </section>
</div>
