services:
  service-registry:
    build:
      context: ./service-registry
    environment:
      EUREKA_INSTANCE_HOSTNAME: service-registry
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  banking-backend:
    build:
      context: ./backend
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: ${DOCKER_DB_URL:-jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-net_banking_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_OPEN_IN_VIEW: "false"
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET}
      APP_SECURITY_TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: banking-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
