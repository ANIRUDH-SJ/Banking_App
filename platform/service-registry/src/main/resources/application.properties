spring.application.name=service-registry
server.port=${EUREKA_SERVER_PORT:8761}
app.registry.username=${EUREKA_USERNAME}
app.registry.password=${EUREKA_PASSWORD}

eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://${eureka.instance.hostname}:${server.port}/eureka/}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Service registry for the Internet Banking platform

server.address=${SERVER_ADDRESS:127.0.0.1}
