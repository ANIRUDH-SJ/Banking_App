name: Backend startup and wrapper

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend
        run: |
          mkdir -p /tmp/banking-tests
          JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=/tmp/banking-tests ./mvnw verify
      - name: Verify architecture
        run: node scripts/verify-architecture.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify wrapper with quoted JAVA_HOME
        shell: pwsh
        run: |
          $env:JAVA_HOME = '"' + $env:JAVA_HOME + '"'
          .\mvnw.cmd --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify backend through Windows wrapper
        shell: pwsh
        run: .\mvnw.cmd verify
