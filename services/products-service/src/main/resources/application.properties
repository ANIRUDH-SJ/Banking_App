spring.application.name=products-service
server.port=${SERVER_PORT:8084}
spring.config.import=classpath:runtime.properties
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:NB_PRODUCTS}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.user=${MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${MIGRATION_PASSWORD:${spring.datasource.password}}
app.events.enabled=true
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
app.deposits.early-closure-rate-reduction=${DEPOSIT_EARLY_CLOSURE_RATE_REDUCTION:1.00}
app.cards.pan-encryption-key=${CARD_PAN_ENCRYPTION_KEY:}
app.cards.pin-transport-private-key=${CARD_PIN_TRANSPORT_KEY:}
app.cards.demo-issuance=${CARD_DEMO_ISSUANCE:false}
app.cards.pin.max-attempts=${CARD_PIN_MAX_ATTEMPTS:3}
app.cards.pin.lock-minutes=${CARD_PIN_LOCK_MINUTES:30}
app.cards.emi.rates=${CARD_EMI_RATES:3:13.00,6:14.00,9:15.00}
app.cards.emi.min-amount=${CARD_EMI_MIN_AMOUNT:2500}
