spring.application.name=accounts-ledger-service
server.port=${SERVER_PORT:8082}
spring.config.import=classpath:runtime.properties
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:NB_ACCOUNTS}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.user=${MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${MIGRATION_PASSWORD:${spring.datasource.password}}
app.events.enabled=true
app.events.kafka.consumer-topic=${KAFKA_EVENT_TOPIC:banking.events.v1}
app.events.kafka.consumer-type=CUSTOMER_REGISTERED
app.onboarding.branch-ifsc=${ONBOARDING_BRANCH_IFSC:NETB0000001}
app.external-transfer.provider=${EXTERNAL_TRANSFER_PROVIDER:mock}
app.external-transfer.mock.failures-before-success=${EXTERNAL_TRANSFER_MOCK_FAILURES:0}
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
