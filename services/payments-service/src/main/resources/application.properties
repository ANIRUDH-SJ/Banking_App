spring.application.name=payments-service
server.port=${SERVER_PORT:8083}
spring.config.import=classpath:runtime.properties
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:NB_PAYMENTS}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.user=${MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${MIGRATION_PASSWORD:${spring.datasource.password}}
app.events.enabled=true
app.payments.transfer-max-amount=${TRANSFER_MAX_AMOUNT:100000}
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
app.biller-payment.provider=${BILLER_PAYMENT_PROVIDER:mock}
app.biller-payment.mock.failures-before-success=${BILLER_PAYMENT_MOCK_FAILURES:0}
app.biller-payment.mock.rejected-reference-prefix=${BILLER_PAYMENT_MOCK_REJECT_PREFIX:}
app.forex.reference-rates=${FOREX_REFERENCE_RATES:INR=1,USD=85.00,EUR=92.50,GBP=108.00,JPY=0.5700,AUD=56.20,CAD=62.40,SGD=63.80}
app.forex.demo-rates=${FOREX_DEMO_RATES:}
app.forex.rates-as-of=${FOREX_RATES_AS_OF:}
app.forex.quote-seconds=${FOREX_QUOTE_SECONDS:120}
