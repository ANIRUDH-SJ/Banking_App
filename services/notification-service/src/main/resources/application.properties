spring.application.name=notification-service
server.port=${SERVER_PORT:8085}
spring.config.import=classpath:runtime.properties
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:NB_NOTIFICATIONS}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.user=${MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${MIGRATION_PASSWORD:${spring.datasource.password}}
app.events.enabled=true
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
app.notifications.email.provider=${NOTIFICATION_EMAIL_PROVIDER:log}
app.notifications.email.from=${NOTIFICATION_EMAIL_FROM:}
app.notifications.sms.provider=${NOTIFICATION_SMS_PROVIDER:log}
app.notifications.delivery.enabled=${NOTIFICATION_DELIVERY_ENABLED:true}
app.notifications.delivery.interval-ms=${NOTIFICATION_DELIVERY_INTERVAL_MS:5000}
app.notifications.delivery.max-attempts=${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
app.notifications.delivery.base-retry-seconds=${NOTIFICATION_DELIVERY_BASE_RETRY_SECONDS:30}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=${SMTP_TEST_CONNECTION:false}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=${SMTP_SSL_CHECK_SERVER_IDENTITY:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}
management.health.mail.enabled=${NOTIFICATION_MAIL_HEALTH_ENABLED:false}
